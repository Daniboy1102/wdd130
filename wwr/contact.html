<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Iron Rapids</title>
    <meta name="description"
        content="Contact Iron Rapids for rafting trip reservations, general inquiries, and questions about our whitewater rafting adventures.">
    <meta name="author" content="Daniel Nunes Venancio">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Iron Rapids Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Iron Rapids Co.</h1>
            <p>123 Coloma<br>Sacramento, California</p>
            <p><a href="tel:+19999999999">+1 123 4567 8910</a></p>
            <p><a href="mailto:info@ironrapids.com">info@ironrapids.com</a></p>
        </section>

        <section class="contact-grid">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d99999.12345!2d-120.8947!3d38.8025!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809adb3d48e4f13b%3A0x7c8b4fbbf2e3a5e9!2sColoma%2C%20CA%2095613!5e0!3m2!1sen!2sus!4v1234567890123!5m2!1sen!2sus"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade" title="Iron Rapids Location">
                </iframe>
            </div>

            <div class="contact-form">
                <form action="submit-contact.php" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="website">
                            <input type="radio" id="website" name="purpose" value="website">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Type your message here..."
                        required></textarea>

                    <label for="newsletter" class="checkbox-label">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Sarah Mitchell">
                    <figcaption>Sarah Mitchell<br>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Emma Rodriguez">
                    <figcaption>Emma Rodriguez<br>Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="John willy">
                    <figcaption>John Willy<br>Customer Experience Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 Iron Rapids Co. | Daniel Nunes Venancio
        </p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
